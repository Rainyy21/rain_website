services:
  # Cloudflare Tunnel: makes an outbound connection to Cloudflare, so no ports
  # need to be opened or forwarded. Create the tunnel in the Zero Trust
  # dashboard (Networks -> Tunnels), copy its token into CLOUDFLARE_TUNNEL_TOKEN,
  # and add a Public Hostname: <your domain>  ->  HTTP  ->  web:80
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on: [web]

  web:
    build: .
    restart: unless-stopped
    # No published ports: only cloudflared reaches Caddy, over the compose network.
    # Cloudflare terminates TLS, so Caddy serves plain HTTP. ":80" disables
    # Caddy's automatic HTTPS (its ACME challenge can't succeed behind a tunnel).
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [tracker]

  tracker:
    build: { context: ., dockerfile: tracker/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tracker_rw:${TRACKER_PASSWORD}@${DB_HOST:-db}:5432/${POSTGRES_DB}
      TRACKER_SECRET: ${TRACKER_SECRET}
      SITE_HOST: ${SITE_HOST}
    volumes: ["./geoip:/data:ro"]
    depends_on: []

  linkcheck:
    build: { context: ., dockerfile: tracker/Dockerfile }
    restart: unless-stopped
    command: ["sh", "-c", "while true; do python check_links.py; sleep 86400; done"]
    environment:
      DATABASE_URL: postgresql://tracker_rw:${TRACKER_PASSWORD}@${DB_HOST:-db}:5432/${POSTGRES_DB}
      KUMA_PUSH_URL: ${KUMA_LINKS_PUSH_URL:-}
    depends_on: []

  kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports: ["${KUMA_BIND:-127.0.0.1:3001}:3001"]
    volumes: [kuma_data:/app/data]

volumes: { caddy_data: {}, caddy_config: {}, kuma_data: {} }
