apiVersion: v1
kind: Service
metadata:
  name: tracker
  namespace: rain-hub
spec:
  type: NodePort
  selector:
    app: tracker
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker
  namespace: rain-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracker
  template:
    metadata:
      labels:
        app: tracker
    spec:
      containers:
        - name: tracker
          image: rain-hub-tracker:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: rain-hub-secrets
          volumeMounts:
            - name: geoip
              mountPath: /data
              readOnly: true
      volumes:
        - name: geoip
          configMap:
            name: geoip-data
            optional: true
