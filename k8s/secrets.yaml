apiVersion: v1
kind: Secret
metadata:
  name: rain-hub-secrets
  namespace: rain-hub
type: Opaque
stringData:
  POSTGRES_USER: rainhub
  POSTGRES_PASSWORD: "CHANGE-ME"
  POSTGRES_DB: rainhub
  TRACKER_PASSWORD: "CHANGE-ME"
  STATS_RO_PASSWORD: "CHANGE-ME"
  TRACKER_SECRET: "CHANGE-ME"
  DATABASE_URL: "postgresql://tracker_rw:CHANGE-ME@db:5432/rainhub"
  SITE_HOST: "links.yourdomain.com"
  BACKUP_TARGET: "user@backup-host:/srv/backups/rain-hub"
  BACKUP_PORT: "22"
