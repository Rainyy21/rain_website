apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: rain-hub
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: rain-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: rain-hub-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
